<main class="page">
  <header class="page-toolbar">
    <div>
      <p class="section-label">Administration</p>
      <h1>Users</h1>
      <p class="toolbar-subtitle">
        {{
          canManageUsers()
            ? 'Administrator access: add, edit, view, and delete users.'
            : 'Read-only access: view and filter users.'
        }}
      </p>
    </div>

    @if (canManageUsers()) {
      <button mat-flat-button type="button" (click)="openAdd()">Add user</button>
    }
  </header>

  <section class="filters-card" aria-label="User filters">
    <div class="filters-row">
      <mat-form-field class="filter-field" appearance="outline" subscriptSizing="dynamic">
        <mat-label>Search by name or country</mat-label>
        <input
          matInput
          type="text"
          [ngModel]="searchTerm"
          (ngModelChange)="handleSearchChange($event)"
        />
      </mat-form-field>

      <mat-form-field class="filter-field" appearance="outline" subscriptSizing="dynamic">
        <mat-label>Gender</mat-label>
        <mat-select [ngModel]="genderFilter" (ngModelChange)="handleGenderChange($event)">
          @for (option of genderOptions; track option.value) {
            <mat-option [value]="option.value">{{ option.label }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>
  </section>

  <app-user-table
    [users]="users()"
    [first]="first"
    [totalRecords]="total()"
    [pageSize]="pageSize"
    [canManageUsers]="canManageUsers()"
    [hasActiveFilters]="hasActiveFilters"
    [loading]="loading()"
    (view)="openView($event)"
    (edit)="openEdit($event)"
    (remove)="handleDelete($event)"
    (pageChange)="handlePageChange($event)"
  />

  <app-user-dialog
    [visible]="dialogVisible()"
    [mode]="dialogMode()"
    [user]="selectedUser()"
    [saving]="savingUser()"
    (close)="handleClose()"
    (save)="handleSave($event)"
  ></app-user-dialog>

  <app-confirm-dialog
    [visible]="confirmDeleteVisible()"
    title="Confirm delete"
    confirmLabel="Delete"
    [message]="'Delete ' + (userPendingDelete()?.name ?? 'this user') + '?'"
    (cancel)="cancelDelete()"
    (confirm)="confirmDelete()"
  />
</main>
