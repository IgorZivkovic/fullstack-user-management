@if (visible()) {
  <div class="confirm-backdrop" (click)="cancel.emit()">
    <section
      class="confirm-panel"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="title()"
      (click)="$event.stopPropagation()"
    >
      <h2>{{ title() }}</h2>
      <p>{{ message() }}</p>

      <div class="confirm-actions">
        <button mat-stroked-button type="button" [disabled]="busy()" (click)="cancel.emit()">
          {{ cancelLabel() }}
        </button>
        <button
          mat-flat-button
          class="danger-button"
          type="button"
          [disabled]="busy()"
          (click)="confirm.emit()"
        >
          {{ busy() ? 'Deleting...' : confirmLabel() }}
        </button>
      </div>
    </section>
  </div>
}
