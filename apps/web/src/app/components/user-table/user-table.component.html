<div class="table-scroll">
  <table mat-table [dataSource]="users" class="users-table">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let user">{{ user.id }}</td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let user">{{ user.name }}</td>
    </ng-container>

    <ng-container matColumnDef="birthday">
      <th mat-header-cell *matHeaderCellDef>Birthday</th>
      <td mat-cell *matCellDef="let user">{{ user.birthday | date: 'MMM d, y' }}</td>
    </ng-container>

    <ng-container matColumnDef="gender">
      <th mat-header-cell *matHeaderCellDef>Gender</th>
      <td mat-cell *matCellDef="let user">{{ user.gender }}</td>
    </ng-container>

    <ng-container matColumnDef="country">
      <th mat-header-cell *matHeaderCellDef>Country</th>
      <td mat-cell *matCellDef="let user">{{ user.country }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="actions-heading">Actions</th>
      <td mat-cell *matCellDef="let user">
        <div class="actions-cell">
          <button
            mat-icon-button
            matTooltip="View"
            class="view-action"
            type="button"
            aria-label="View user"
            (click)="view.emit(user)"
          >
            <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5C21.27 7.61 17 4.5 12 4.5Zm0 12.5a5 5 0 1 1 0-10 5 5 0 0 1 0 10Zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"
              />
            </svg>
          </button>
          @if (canManageUsers) {
            <button
              mat-icon-button
              matTooltip="Edit"
              class="edit-action"
              type="button"
              aria-label="Edit user"
              (click)="edit.emit(user)"
            >
              <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path
                  d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25ZM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83Z"
                />
              </svg>
            </button>
            <button
              mat-icon-button
              matTooltip="Delete"
              class="danger-action"
              type="button"
              aria-label="Delete user"
              (click)="remove.emit(user)"
            >
              <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path
                  d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12Zm3.46-7.12 1.13-1.13L12 12.17l1.41-1.42 1.13 1.13L13.13 13.3l1.41 1.41-1.13 1.13L12 14.42l-1.41 1.42-1.13-1.13 1.41-1.41-1.41-1.42ZM15.5 4l-1-1h-5l-1 1H5v2h14V4h-3.5Z"
                />
              </svg>
            </button>
          }
        </div>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell empty-cell" colspan="6">{{ emptyMessage }}</td>
    </tr>
  </table>
</div>

<mat-paginator
  [length]="totalRecords"
  [pageIndex]="pageIndex"
  [pageSize]="pageSize"
  [pageSizeOptions]="[pageSize]"
  [hidePageSize]="true"
  [showFirstLastButtons]="true"
  [disabled]="loading"
  aria-label="Select users page"
  (page)="handlePageChange($event)"
/>
