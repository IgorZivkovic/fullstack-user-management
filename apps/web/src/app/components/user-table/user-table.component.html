<app-data-table-shell
  [data]="users"
  [displayedColumns]="displayedColumns"
  [loading]="loading"
  loadingMessage="Loading users..."
  [emptyMessage]="emptyMessage"
  [totalRecords]="totalRecords"
  [pageIndex]="pageIndex"
  [pageSize]="pageSize"
  tableMinWidth="760px"
  paginatorLabel="Select users page"
  (pageChange)="handlePageChange($event)"
>
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>ID</th>
    <td mat-cell *matCellDef="let user">{{ user.id }}</td>
  </ng-container>

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let user">{{ user.name }}</td>
  </ng-container>

  <ng-container matColumnDef="birthday">
    <th mat-header-cell *matHeaderCellDef>Birthday</th>
    <td mat-cell *matCellDef="let user">{{ user.birthday | date: 'MMM d, y' }}</td>
  </ng-container>

  <ng-container matColumnDef="gender">
    <th mat-header-cell *matHeaderCellDef>Gender</th>
    <td mat-cell *matCellDef="let user">{{ user.gender }}</td>
  </ng-container>

  <ng-container matColumnDef="country">
    <th mat-header-cell *matHeaderCellDef>Country</th>
    <td mat-cell *matCellDef="let user">{{ user.country }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef class="actions-heading">Actions</th>
    <td mat-cell *matCellDef="let user">
      <div class="actions-cell">
        <button
          mat-icon-button
          matTooltip="View"
          class="view-action"
          type="button"
          aria-label="View user"
          (click)="view.emit(user)"
        >
          <mat-icon class="action-icon" fontSet="material-symbols-outlined">visibility</mat-icon>
        </button>
        @if (canManageUsers) {
          <button
            mat-icon-button
            matTooltip="Edit"
            class="edit-action"
            type="button"
            aria-label="Edit user"
            (click)="edit.emit(user)"
          >
            <mat-icon class="action-icon" fontSet="material-symbols-outlined">edit</mat-icon>
          </button>
          <button
            mat-icon-button
            matTooltip="Delete"
            class="danger-action"
            type="button"
            aria-label="Delete user"
            (click)="remove.emit(user)"
          >
            <mat-icon class="action-icon" fontSet="material-symbols-outlined">delete</mat-icon>
          </button>
        }
      </div>
    </td>
  </ng-container>
</app-data-table-shell>
