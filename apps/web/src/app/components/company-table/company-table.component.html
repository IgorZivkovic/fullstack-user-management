<app-data-table-shell
  [data]="companies"
  [displayedColumns]="displayedColumns"
  [loading]="loading"
  loadingMessage="Loading companies..."
  [emptyMessage]="emptyMessage"
  [totalRecords]="totalRecords"
  [pageIndex]="pageIndex"
  [pageSize]="pageSize"
  tableMinWidth="780px"
  paginatorLabel="Select companies page"
  (pageChange)="pageChange.emit($event)"
>
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Company</th>
    <td mat-cell *matCellDef="let company">
      <strong>{{ company.name }}</strong>
    </td>
  </ng-container>

  <ng-container matColumnDef="location">
    <th mat-header-cell *matHeaderCellDef>Location</th>
    <td mat-cell *matCellDef="let company">{{ company.location || '—' }}</td>
  </ng-container>

  <ng-container matColumnDef="website">
    <th mat-header-cell *matHeaderCellDef>Website</th>
    <td mat-cell *matCellDef="let company">
      @if (company.website) {
        <a [href]="company.website" target="_blank" rel="noopener noreferrer">Visit site</a>
      } @else {
        <span>—</span>
      }
    </td>
  </ng-container>

  <ng-container matColumnDef="notes">
    <th mat-header-cell *matHeaderCellDef>Notes</th>
    <td mat-cell *matCellDef="let company">
      <span class="notes" [matTooltip]="company.notes || ''">{{ company.notes || '—' }}</span>
    </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef class="actions-heading">Actions</th>
    <td mat-cell *matCellDef="let company">
      <div class="actions-cell">
        <button
          mat-icon-button
          matTooltip="Edit"
          class="edit-action"
          type="button"
          [attr.aria-label]="'Edit ' + company.name"
          (click)="edit.emit(company)"
        >
          <mat-icon class="action-icon" fontSet="material-symbols-outlined">edit</mat-icon>
        </button>
        <button
          mat-icon-button
          matTooltip="Delete"
          class="danger-action"
          type="button"
          [attr.aria-label]="'Delete ' + company.name"
          (click)="remove.emit(company)"
        >
          <mat-icon class="action-icon" fontSet="material-symbols-outlined">delete</mat-icon>
        </button>
      </div>
    </td>
  </ng-container>
</app-data-table-shell>
